<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>edit2</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="is-empty" data-mode="write">
      <header class="titlebar" data-tauri-drag-region>
        <button type="button" class="tb-sidebar" id="btn-sidebar" title="显示/隐藏边栏" aria-label="显示/隐藏边栏" aria-controls="sidebar"></button>
        <div class="tb-side" data-tauri-drag-region></div>
        <div class="tb-title" data-tauri-drag-region>
          <span class="dirty-dot" aria-hidden="true"></span>
          <span class="doc-name" id="doc-name" data-tauri-drag-region></span>
          <span class="doc-dir" id="doc-dir" data-tauri-drag-region></span>
        </div>
        <div class="tabs" data-tauri-drag-region>
          <div class="tab-list" id="tab-list" role="tablist" data-tauri-drag-region></div>
          <button type="button" class="tab-new" id="tab-new" title="新建标签页 ⌘T" aria-label="新建标签页"></button>
        </div>
        <div class="tb-side tb-right" data-tauri-drag-region>
          <div class="seg" role="radiogroup" aria-label="视图">
            <button type="button" role="radio" data-mode="write" title="写作 ⌘1">写作</button>
            <button type="button" role="radio" data-mode="split" title="分栏 ⌘2">分栏</button>
            <button type="button" role="radio" data-mode="read" title="阅读 ⌘3">阅读</button>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="文件夹">
          <div class="sb-head">
            <span class="sb-name" id="sb-name"></span>
            <button type="button" class="sb-btn sb-more" id="sb-more" title="更多" aria-label="文件夹选项" aria-haspopup="menu" aria-expanded="false"></button>
            <button type="button" class="sb-btn sb-close" id="sb-close" title="关闭文件夹" aria-label="关闭文件夹"></button>
          </div>
          <div class="sb-tree" id="sb-tree"></div>
          <div class="sb-resizer" id="sb-resizer" role="separator" aria-orientation="vertical" aria-label="调整边栏宽度" title="拖动调整宽度，双击恢复默认"></div>
        </aside>

        <div class="panes" id="panes">
        <div class="toast" id="toast" role="status"></div>
        <section class="empty" id="empty">
          <div class="empty-box">
            <div class="wordmark">edit<b>2</b></div>
            <p class="tagline">打开任何文本文件，看一眼，改一下</p>
            <div class="actions">
              <button type="button" class="btn primary" id="btn-new">新建 <kbd data-key="N"></kbd></button>
              <button type="button" class="btn" id="btn-open">打开… <kbd data-key="O"></kbd></button>
            </div>
            <div class="recent" id="recent" hidden>
              <h4>最近</h4>
              <ul id="recent-list"></ul>
            </div>
            <p class="drop-hint">或者把文件、文件夹拖到窗口任意位置 · <button type="button" class="link" id="btn-open-folder">打开文件夹…</button></p>
          </div>
        </section>

        <!-- One column of documents: the window has one, or two side by side (main.ts). -->
        <template id="column-tpl">
          <div class="column" data-mode="write">
            <div class="col-tabs">
              <div class="tab-list" role="tablist"></div>
              <button type="button" class="tab-new" title="新建标签页" aria-label="新建标签页"></button>
            </div>
            <div class="col-body">
              <div class="pane editor-pane"></div>
              <div
                class="split-divider"
                role="separator"
                aria-orientation="vertical"
                aria-label="调整编辑与预览的宽度"
                title="拖动调整宽度，双击恢复对半"
                tabindex="0"
              ></div>
              <div class="pane preview-pane" tabindex="-1">
                <div class="preview-error" role="alert" hidden></div>
                <article class="preview"></article>
              </div>
              <aside class="outline" aria-label="大纲">
                <div class="ol-head">大纲</div>
                <nav class="ol-list"></nav>
              </aside>
              <button type="button" class="outline-toggle"></button>
            </div>
          </div>
        </template>
        </div>
      </main>

      <footer class="status">
        <span id="st-pos"></span>
        <span id="st-count"></span>
        <span class="spacer"></span>
        <span id="st-save"></span>
        <button type="button" class="st-btn" id="st-encoding" aria-haspopup="menu" aria-expanded="false"></button>
        <button type="button" class="st-btn" id="st-format" aria-haspopup="menu" aria-expanded="false" title="文件格式"></button>
      </footer>

      <div class="drop-overlay" aria-hidden="true"><span>松开以打开</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
