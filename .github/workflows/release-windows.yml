# Builds the Windows installer and attaches it to a GitHub release, signed for
# the in-app updater and listed in the release's latest.json.
# Runs when a release is published; run it by hand to add the installer to an
# existing release (e.g. one published before this workflow existed).
name: Release (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Package with the Windows settings of the commit the workflow runs from,
      # so a tag made before they existed still gets the right installer.
      - run: git checkout "$GITHUB_SHA" -- src-tauri/tauri.windows.conf.json src-tauri/windows src-tauri/tauri.release.conf.json scripts/publish-update.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Bundle targets and installer settings come from src-tauri/tauri.windows.conf.json;
      # tauri.release.conf.json adds the updater signature (.sig).
      - run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Uploads the installer and its signature, and adds Windows to latest.json.
      - name: Publish installer and update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-update.mjs "$TAG" windows
